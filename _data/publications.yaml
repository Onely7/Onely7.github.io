# Newest first. The first 6 items are shown; the rest go under "Show older news".
news:
  - date: "2026.10"
    text_html: "Our paper “It's Not RoPE That Creates Sinks: The Role of Self-Concentration and Value-Non-Mixing in Attention” was accepted to <strong>EMNLP 2026</strong>."
  - date: "2026.09"
    text_html: "Started a research visit at the <strong>University of Cambridge</strong> (Department of Computer Science and Technology) as a visiting researcher, hosted by Prof. Andreas Vlachos."
  - date: "2026.09"
    text_html: "Our book <strong>“マルチモーダルモデル入門” (Introduction to Multimodal Models)</strong> was published by Gijutsu-Hyoron."
  - date: "2026.09"
    text_html: "Our paper “MOMIJI: A Large-Scale Japanese Interleaved Image-Text Dataset” was accepted to the <strong>Journal of Natural Language Processing</strong>."
  - date: "2026.09"
    text_html: "Our paper “Read or Ignore? A Unified Benchmark for Typographic-Attack Robustness and Text Recognition in Vision-Language Models” was accepted to <strong>ECCV 2026</strong>."
  - date: "2026.06"
    text_html: "Our CVPR 2026 paper “Text-Printed Image” received the <strong>CVPR Compute Gold Star Award</strong>."
  - date: "2026.03"
    text_html: "Our team won <strong>1st place in the open division</strong> and 2nd place overall in the FT-LLM2026 Math Task."
  - date: "2026.03"
    text_html: "Four co-authored papers were presented at NLP 2026; two of them received the Young Researcher Encouragement Award."
  - date: "2026.01"
    text_html: "Our paper “STRIDE-QA” was presented at <strong>AAAI 2026</strong>, and our journal paper “Instruction-Following Evaluation of Large Vision-Language Models” was published in <em>New Generation Computing</em>."
  - date: "2025.11"
    text_html: "Our paper “Batch-wise Convergent Pre-training” was presented at the First BabyLM Workshop."
  - date: "2025.08"
    text_html: "Gave a talk introducing the CVPR 2025 paper “Words or Vision: Do Vision-Language Models Have Blind Faith in Text?” at the 17th Saisentan NLP Study Group (SNLP 2025)."

