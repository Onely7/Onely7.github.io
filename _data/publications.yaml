# About text: shown as one block, each item on a line of its own.
about:
  - "My research mainly focuses on the development, application, and analysis of large <span class=\"nowrap\">vision-language</span> models (LVLMs)."
  - "I am a third-year Ph.D. student at the Graduate School of Information Sciences, Tohoku&nbsp;University, advised by Prof. <a href=\"https://scholar.google.com/citations?user=XO5CrIsAAAAJ&amp;hl=en\">Jun Suzuki</a>."

