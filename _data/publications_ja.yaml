about:
  - "大学では主に、大規模視覚言語モデル（LVLM）の開発・応用・分析に関する研究に従事。"
  - "<a href=\"https://scholar.google.com/citations?user=XO5CrIsAAAAJ&amp;hl=en\">鈴木 潤</a> 教授の指導のもと、東北大学 大学院情報科学研究科 博士後期課程 3&nbsp;年に在籍中。"

research_interests:
  - "Vision & Language"
  - "NLP"

# 新しい順に記載。先頭 6 件を表示し、残りは「過去のニュースを表示」に折りたたみます。
news:
  - date: "2026.10"
    text_html: "共著論文「It's Not RoPE That Creates Sinks: The Role of Self-Concentration and Value-Non-Mixing in Attention」が <strong>EMNLP 2026</strong> に採択されました。"
  - date: "2026.09"
    text_html: "<strong>ケンブリッジ大学</strong>に留学し、Department of Computer Science and Technology の Andreas Vlachos 教授のもとで Visiting Researcher として研究を始めました。"
  - date: "2026.09"
    text_html: "共著書籍<strong>『マルチモーダルモデル入門』</strong>（技術評論社）が刊行されました。"
  - date: "2026.09"
    text_html: "論文「MOMIJI: 日本語大規模インターリーブ視覚言語データセット」が論文誌<strong>『自然言語処理』</strong>に採録されました。"
  - date: "2026.09"
    text_html: "共著論文「Read or Ignore? A Unified Benchmark for Typographic-Attack Robustness and Text Recognition in Vision-Language Models」が <strong>ECCV 2026</strong> に採択されました。"
  - date: "2026.06"
    text_html: "CVPR 2026 の共著論文「Text-Printed Image」が <strong>CVPR Compute Gold Star Award</strong> を受賞しました。"
  - date: "2026.03"
    text_html: "FT-LLM2026 数学タスクにて、チームで<strong>オープン部門 1位</strong>・総合部門 2位を獲得しました。"
  - date: "2026.03"
    text_html: "言語処理学会第32回年次大会（NLP 2026）で共著論文 4 件が発表され、うち 2 件が若手奨励賞を受賞しました。"
  - date: "2026.01"
    text_html: "共著論文「STRIDE-QA」を <strong>AAAI 2026</strong> で発表し、筆頭論文「Instruction-Following Evaluation of Large Vision-Language Models」が論文誌 <em>New Generation Computing</em> に掲載されました。"
  - date: "2025.11"
    text_html: "共著論文「Batch-wise Convergent Pre-training」を First BabyLM Workshop で発表しました。"
  - date: "2025.08"
    text_html: "第17回 最先端NLP勉強会（SNLP 2025）で CVPR 2025 の論文「Words or Vision: Do Vision-Language Models Have Blind Faith in Text?」を紹介しました。"

