<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | onely7.dev</title>
<script>
  // 旧ブログの URL（https://onely7.github.io/my-dl-wiki/... は GitHub が https://onely7.dev/my-dl-wiki/... に転送する）を、
  // 新しいブログ（https://onely7.dev/blog/...）の同じページへ転送する。パス・クエリ・# 以降はそのまま引き継ぐ。
  (function () {
    var OLD = "/my-dl-wiki";
    var NEW = "/blog";
    var path = window.location.pathname;
    if (path === OLD || path.indexOf(OLD + "/") === 0) {
      window.location.replace(NEW + (path.slice(OLD.length) || "/") + window.location.search + window.location.hash);
    }
  })();
</script>
<script>
  // ポートフォリオのテーマボタンで選んだテーマ（js/style.js が localStorage の
  // "portfolio-theme" に保存）があれば、それに合わせる。なければ OS の設定。
  try {
    var theme = localStorage.getItem("portfolio-theme");
    if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
</script>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a18" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon_images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon_images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon_images/favicon-16x16.png">
<!-- ポートフォリオと同じフォント（Shippori Mincho: 見出し、Zen Kaku Gothic New: 本文） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ポートフォリオの色（メイン #443322、アクセント #91b4c8）。ダークテーマも同じ値 */
  :root {
    color-scheme: light;
    --ink: #443322;
    --muted: #686870;
    --bg: #ffffff;
    --accent: #91b4c8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ink: #e8e1d8;
      --muted: #aaa49c;
      --bg: #1c1a18;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #e8e1d8;
    --muted: #aaa49c;
    --bg: #1c1a18;
  }

  body {
    display: grid;
    min-height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", YuGothic, Meiryo, sans-serif;
    place-items: center;
  }

  main {
    max-width: 32rem;
    padding: 2rem 1.25rem;
    line-height: 1.8;
    text-align: center;
  }

  h1 {
    margin: 0 0 0.75rem;
    padding-left: 0.1em; /* letter-spacing の分、中央に */
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", YuMincho, serif;
    font-size: 3.25rem;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: 0.1em;
  }

  p {
    margin: 0.25rem 0;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-wrap: balance; /* 折り返すときは行の長さをそろえる */
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
    margin-top: 1.75rem;
  }

  a {
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 0.04em;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 1.5px;
    text-underline-offset: 4px;
    transition: text-decoration-color 0.2s;
  }

  a:hover {
    text-decoration-color: currentColor;
  }

  a:focus-visible {
    border-radius: 4px;
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>ページが見つかりませんでした。</p>
  <p lang="en">The page you were looking for could not be found.</p>
  <nav>
    <a href="/">Portfolio</a>
    <a href="/blog/">Blog</a>
  </nav>
</main>
</body>
</html>
